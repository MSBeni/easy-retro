name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config from the repository secret
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$FIREBASE_WEB_CONFIG" ]; then
            echo "::error::Add a FIREBASE_WEB_CONFIG repository secret (see README)."
            exit 1
          fi
          node -e '
            const cfg = JSON.parse(process.env.FIREBASE_WEB_CONFIG);
            for (const k of ["apiKey", "authDomain", "databaseURL", "projectId", "appId"]) {
              if (!cfg[k]) { console.error("FIREBASE_WEB_CONFIG is missing " + k); process.exit(1); }
            }
            require("fs").writeFileSync("public/config.js", "window.RETRO_FIREBASE_CONFIG = " + JSON.stringify(cfg) + ";\n");
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
